name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # reused by deploy.yml so a deploy only runs after the same checks pass

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  app-worker:
    name: app-worker tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-worker/package-lock.json
      - run: npm ci
        working-directory: app-worker
      - run: npm test # pretest creates the empty ../app-ui/dist the assets binding needs
        working-directory: app-worker
      - run: npm run typecheck
        working-directory: app-worker

  app-ui:
    name: app-ui tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-ui/package-lock.json
      - run: npm ci
        working-directory: app-ui
      - run: npm test
        working-directory: app-ui
      - run: npm run build
        working-directory: app-ui
