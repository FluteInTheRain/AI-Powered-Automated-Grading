server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: /exam/:token, /admin/:token etc. are resolved client-side
    # (frontend/src/main.jsx's pathname switch, no router library) — nginx
    # must still serve index.html for those paths rather than 404.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grading a submission runs 3-4 sequential LLM calls — give it real
        # headroom instead of nginx's 60s default.
        proxy_read_timeout 180s;
    }
}
