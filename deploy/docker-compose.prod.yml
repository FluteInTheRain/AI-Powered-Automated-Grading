# Single-VM demo deployment (see deploy/README.md). llama-server is
# deliberately NOT a service here — it runs natively on the host as a
# systemd unit (deploy/llama-server.service) so it gets direct GPU access
# without setting up the nvidia-docker toolkit. Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-grading}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grading}"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-grading}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-grading}
      # host-gateway resolves to the VM's own IP from inside the container,
      # reaching the systemd-managed llama-server on the host.
      LLM_BASE_URL: http://host.docker.internal:8080/v1
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
